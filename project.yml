# 架构约束（勿删）：宿主 App（非沙盒）与 FinderSync 扩展（沙盒，pkd 强制要求）
# 通过共享文件 ~/.easy-context/config.json 交换配置。关键：ConfigStore 用
# getpwuid(getuid())->pw_dir 取【真实】家目录——沙盒里 NSHomeDirectory() 会被重定向
# 到容器，导致宿主与扩展读到不同文件、配置“不生效”；getpwuid 读用户数据库、不被
# 沙盒重定向，两端都得到 /Users/<用户>。扩展的普通 Finder 路径访问由
# temporary-exception.files.absolute-path.read-only 放行；仅共享的
# ~/.easy-context/ 目录通过 home-relative-path.read-write 允许读写。
# 若将来为公证/上架收紧沙盒，需改用 App Group 容器并相应改 ConfigStore 的路径来源。
#
# 身份隔离（勿删）：Debug 构建使用独立的 bundle id、URL scheme 与显示名。macOS 隐私授权
# （TCC）按 bundle id 只保存一条记录、按签名身份校验；若开发版与安装版同名，两者会互相
# 覆盖授权，并争抢 easycontext:// URL，表现为「用着用着外置盘没有权限」。
# 发布版签名见 scripts/build-pkg.sh（EC_SIGN_IDENTITY，自签名固定证书）。
name: EasyContext
options:
  bundleIdPrefix: com.luyantao.easycontext
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    MARKETING_VERSION: 1.1.3
    CURRENT_PROJECT_VERSION: 13
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.0"
    EC_BUNDLE_ID_BASE: com.luyantao.easycontext
    EC_URL_SCHEME: easycontext
    EC_DISPLAY_NAME: Easy Context
  configs:
    Debug:
      EC_BUNDLE_ID_BASE: com.luyantao.easycontext.debug
      EC_URL_SCHEME: easycontext-debug
      EC_DISPLAY_NAME: Easy Context Debug
    Release:
      # 发布产物不注入 Xcode 默认的调试 entitlement；Debug 保持默认行为，便于开发调试。
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"
packages:
  EasyContextCore:
    path: EasyContextCore
targets:
  EasyContext:
    type: application
    platform: macOS
    sources:
      - EasyContext
      # 卸载脚本随 App 分发：/Applications/EasyContext.app/Contents/Resources/uninstall.sh
      - path: packaging/uninstall.sh
        buildPhase: resources
    dependencies:
      - package: EasyContextCore
        product: EasyContextCore
      - target: EasyContextFinder
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EC_BUNDLE_ID_BASE)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: EasyContext/Info.plist
      properties:
        CFBundleDisplayName: "$(EC_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - ja
          - de
          - fr
          - es
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes: ["$(EC_URL_SCHEME)"]
        # 宿主与扩展从各自 Info.plist 读取 IPC URL scheme（见 EasyContextCore/IPCScheme）。
        ECURLScheme: "$(EC_URL_SCHEME)"
        NSAppleEventsUsageDescription: "Used to run commands (such as claude / codex) in the terminal you choose."
  EasyContextFinder:
    type: app-extension
    platform: macOS
    sources:
      - EasyContextFinder
    dependencies:
      - package: EasyContextCore
        product: EasyContextCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(EC_BUNDLE_ID_BASE).finder"
        CODE_SIGN_ENTITLEMENTS: EasyContextFinder/EasyContextFinder.entitlements
    info:
      path: EasyContextFinder/Info.plist
      properties:
        # 系统设置 → 扩展列表里显示的名字，与宿主品牌一致
        CFBundleDisplayName: "$(EC_DISPLAY_NAME)"
        ECURLScheme: "$(EC_URL_SCHEME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - ja
          - de
          - fr
          - es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSyncExtension
