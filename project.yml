# 架构约束（勿删）：宿主 App（非沙盒）与 FinderSync 扩展（沙盒，pkd 强制要求）
# 通过共享文件 ~/.easy-context/config.json 交换配置。关键：ConfigStore 用
# getpwuid(getuid())->pw_dir 取【真实】家目录——沙盒里 NSHomeDirectory() 会被重定向
# 到容器，导致宿主与扩展读到不同文件、配置“不生效”；getpwuid 读用户数据库、不被
# 沙盒重定向，两端都得到 /Users/<用户>。扩展靠 EasyContextFinder.entitlements 里的
# temporary-exception.files.absolute-path.read-write 放行该路径读写。
# 若将来为公证/上架收紧沙盒，需改用 App Group 容器并相应改 ConfigStore 的路径来源。
name: EasyContext
options:
  bundleIdPrefix: com.luyantao.easycontext
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    PRODUCT_NAME: "$(TARGET_NAME)"
    SWIFT_VERSION: "5.0"
packages:
  EasyContextCore:
    path: EasyContextCore
targets:
  EasyContext:
    type: application
    platform: macOS
    sources:
      - EasyContext
    dependencies:
      - package: EasyContextCore
        product: EasyContextCore
      - target: EasyContextFinder
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luyantao.easycontext
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: EasyContext/Info.plist
      properties:
        CFBundleDisplayName: Easy Context
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        CFBundleURLTypes:
          - CFBundleURLName: com.luyantao.easycontext
            CFBundleURLSchemes: [easycontext]
        NSAppleEventsUsageDescription: "用于在你选择的终端里运行命令（如 claude / codex）。"
  EasyContextFinder:
    type: app-extension
    platform: macOS
    sources:
      - EasyContextFinder
    dependencies:
      - package: EasyContextCore
        product: EasyContextCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luyantao.easycontext.finder
        CODE_SIGN_ENTITLEMENTS: EasyContextFinder/EasyContextFinder.entitlements
    info:
      path: EasyContextFinder/Info.plist
      properties:
        CFBundleDisplayName: EasyContextFinder
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSyncExtension
