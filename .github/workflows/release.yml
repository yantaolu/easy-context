name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.value }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Validate tag and master ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(./scripts/version.sh --check-tag "$tag")"
          if ! git show-ref --verify --quiet refs/remotes/origin/master; then
            echo "origin/master was not fetched by checkout" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "Release tag $tag does not point to a commit reachable from origin/master" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$(./scripts/version.sh --build)" >> "$GITHUB_OUTPUT"

  test-core:
    needs: validate-release
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report test environment
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          swift --version
      - name: Test version management scripts
        run: ./scripts/test-version.sh
      - name: Test core logic
        run: >-
          swift test --package-path EasyContextCore
          --skip CommandsTests/test_builtin_muxy_routesCommandToPaneCreatedForNewTab

  build:
    needs: [validate-release, test-core]
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target_arch: [arm64, x86_64]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VERSION: ${{ needs.validate-release.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate-release.outputs.build_number }}
      TARGET_ARCH: ${{ matrix.target_arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install XcodeGen and report build environment
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          uname -m
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Build ${{ matrix.target_arch }} installer package
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-pkg-${TARGET_ARCH}.log"
          set +e
          TARGET_ARCH="$TARGET_ARCH" ./scripts/build-pkg.sh 2>&1 | tee "$log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            error_log="$(
              {
                grep -Ei 'error:|fatal|(^|[[:space:]])ld(:|[[:space:]])|Undefined symbols|BUILD FAILED|failed|not found|No such file|构建产物|Finder 扩展|lipo|codesign|pkgbuild' "$log" | tail -n 20 || true
                printf '%s\n' '--- build-pkg tail context ---'
                tail -n 8 "$log" || true
              } | awk '
                {
                  line = $0
                  if (length(line) > 1000) line = substr(line, 1, 997) "..."
                  if (total + length(line) + 1 > 12000) exit
                  print line
                  total += length(line) + 1
                  if (++lines >= 29) exit
                }
              ' || true
            )"
            error_log="${error_log//%/%25}"
            error_log="${error_log//$'\r'/%0D}"
            error_log="${error_log//$'\n'/%0A}"
            if (( ${#error_log} > 20000 )); then
              error_log="${error_log:0:19997}..."
            fi
            printf '::error title=build-pkg (%s) failed::%s\n' "$TARGET_ARCH" "$error_log"
            exit "$build_status"
          fi
      - name: Create ${{ matrix.target_arch }} checksum
        shell: bash
        run: |
          set -euo pipefail
          pkg="EasyContext-${VERSION}-macOS-${TARGET_ARCH}.pkg"
          (cd dist && shasum -a 256 "$pkg" > "${pkg}.sha256")
      - name: Upload ${{ matrix.target_arch }} release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets-${{ matrix.target_arch }}
          path: |
            dist/EasyContext-${{ needs.validate-release.outputs.version }}-macOS-${{ matrix.target_arch }}.pkg
            dist/EasyContext-${{ needs.validate-release.outputs.version }}-macOS-${{ matrix.target_arch }}.pkg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums and create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="release-assets"
          assets=()
          for target_arch in arm64 x86_64; do
            pkg="${release_dir}/EasyContext-${VERSION}-macOS-${target_arch}.pkg"
            checksum="${pkg}.sha256"
            if [[ ! -s "$pkg" ]]; then
              echo "Missing or empty ${target_arch} installer package: $pkg" >&2
              exit 1
            fi
            if [[ ! -s "$checksum" ]]; then
              echo "Missing or empty ${target_arch} checksum: $checksum" >&2
              exit 1
            fi
            (cd "$release_dir" && sha256sum -c "$(basename "$checksum")")
            assets+=("$pkg" "$checksum")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "$TAG" \
            --notes $'⚠️ 此 Release 的 .pkg 未签名；其中的 App 使用 ad-hoc 签名且未经过 Apple 公证。首次安装或打开时 macOS 可能显示安全警告；请仅从本 Release 下载。\n\n下载选择：Apple Silicon（M 系列）Mac 请下载 `EasyContext-<版本>-macOS-arm64.pkg`；Intel Mac 请下载 `EasyContext-<版本>-macOS-x86_64.pkg`。'
          gh release edit "$TAG" --draft=false --latest
