name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Validate tag and master ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be vX.Y.Z: $tag" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/master; then
            echo "origin/master was not fetched by checkout" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/master; then
            echo "Release tag $tag does not point to a commit reachable from origin/master" >&2
            exit 1
          fi
          echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen and report build environment
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          uname -m
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Test core logic
        run: >-
          swift test --package-path EasyContextCore
          --skip CommandsTests/test_builtin_muxy_routesCommandToPaneCreatedForNewTab
      - name: Build universal installer package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-pkg.log"
          set +e
          ./scripts/build-pkg.sh 2>&1 | tee "$log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            error_log="$(tail -n 80 "$log")"
            error_log="${error_log//%/%25}"
            error_log="${error_log//$'\r'/%0D}"
            error_log="${error_log//$'\n'/%0A}"
            printf '::error title=build-pkg failed::%s\n' "$error_log"
            exit "$build_status"
          fi
      - name: Create checksum
        run: >-
          (cd dist && shasum -a 256
          EasyContext-${{ steps.version.outputs.value }}-macOS-universal.pkg
          > EasyContext-${{ steps.version.outputs.value }}-macOS-universal.pkg.sha256)
      - name: Upload release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: |
            dist/EasyContext-${{ steps.version.outputs.value }}-macOS-universal.pkg
            dist/EasyContext-${{ steps.version.outputs.value }}-macOS-universal.pkg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-assets
          path: release-assets
      - name: Verify checksum and create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pkg="release-assets/EasyContext-${VERSION}-macOS-universal.pkg"
          checksum="${pkg}.sha256"
          (cd release-assets && sha256sum -c "$(basename "$checksum")")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release: $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "$pkg" "$checksum" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "$TAG" \
            --notes $'⚠️ 此 Release 的 .pkg 未签名；其中的 App 使用 ad-hoc 签名且未经过 Apple 公证。首次安装或打开时 macOS 可能显示安全警告；请仅从本 Release 下载。'
          gh release edit "$TAG" --draft=false
