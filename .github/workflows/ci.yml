name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report test environment
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          swift --version
      - name: Test version management scripts
        run: ./scripts/test-version.sh
      - name: Test core logic
        run: >-
          swift test --package-path EasyContextCore
          --skip CommandsTests/test_builtin_muxy_routesCommandToPaneCreatedForNewTab

  package:
    needs: test-core
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target_arch: [arm64, x86_64]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TARGET_ARCH: ${{ matrix.target_arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install XcodeGen and report build environment
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          uname -m
          xcodebuild -version
          swift --version
          xcodegen --version
      - id: version
        name: Read product version from project.yml
        shell: bash
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh --version)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(./scripts/version.sh --build)" >> "$GITHUB_ENV"
      - name: Build ${{ matrix.target_arch }} installer package
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-pkg-${TARGET_ARCH}.log"
          set +e
          TARGET_ARCH="$TARGET_ARCH" ./scripts/build-pkg.sh 2>&1 | tee "$log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            error_log="$(
              {
                grep -Ei 'error:|fatal|(^|[[:space:]])ld(:|[[:space:]])|Undefined symbols|BUILD FAILED|failed|not found|No such file|构建产物|Finder 扩展|lipo|codesign|pkgbuild' "$log" | tail -n 20 || true
                printf '%s\n' '--- build-pkg tail context ---'
                tail -n 8 "$log" || true
              } | awk '
                {
                  line = $0
                  if (length(line) > 1000) line = substr(line, 1, 997) "..."
                  if (total + length(line) + 1 > 12000) exit
                  print line
                  total += length(line) + 1
                  if (++lines >= 29) exit
                }
              ' || true
            )"
            error_log="${error_log//%/%25}"
            error_log="${error_log//$'\r'/%0D}"
            error_log="${error_log//$'\n'/%0A}"
            if (( ${#error_log} > 20000 )); then
              error_log="${error_log:0:19997}..."
            fi
            printf '::error title=build-pkg (%s) failed::%s\n' "$TARGET_ARCH" "$error_log"
            exit "$build_status"
          fi
      - name: Upload ${{ matrix.target_arch }} installer package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EasyContext-ci-${{ github.sha }}-macOS-${{ matrix.target_arch }}
          path: dist/EasyContext-${{ steps.version.outputs.value }}-macOS-${{ matrix.target_arch }}.pkg
          if-no-files-found: error
          retention-days: 7
