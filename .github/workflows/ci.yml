name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install XcodeGen and report build environment
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          uname -m
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Test core logic
        run: >-
          swift test --package-path EasyContextCore
          --skip CommandsTests/test_builtin_muxy_routesCommandToPaneCreatedForNewTab
      - name: Build universal installer package
        env:
          VERSION: "1.0.0"
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build-pkg.log"
          set +e
          ./scripts/build-pkg.sh 2>&1 | tee "$log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            error_log="$(tail -n 80 "$log")"
            error_log="${error_log//%/%25}"
            error_log="${error_log//$'\r'/%0D}"
            error_log="${error_log//$'\n'/%0A}"
            printf '::error title=build-pkg failed::%s\n' "$error_log"
            exit "$build_status"
          fi
      - name: Upload installer package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EasyContext-macOS-universal
          path: dist/EasyContext-*-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 7
